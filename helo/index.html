<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <style>
        body {
    
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f3e8ff, #d8b4fe);
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.15);
            width: 320px;
            border: 1px solid #e9d5ff;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #581c87;
            font-size: 22px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 12px;
            color: #6b21a8;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 2px solid #e9d5ff;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #a855f7;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #6d28d9;
        }
        .resultado {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Cálculo de Média</h2>
        
        <label for="nota1">1ª Nota:</label>
        <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="Ex: 8.0">

        <label for="nota2">2ª Nota:</label>
        <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="Ex: 6.5">

        <label for="nota3">3ª Nota:</label>
        <input type="number" id="nota3" step="0.1" min="0" max="10" placeholder="Ex: 7.0">

        <button onclick="calcular()">Calcular</button>

        <div id="resultado" class="resultado"></div>
    </div>

    <script src="iundex.js"></script>
</body>
</html>
